<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gemini-svg.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mirkarim Bahodirovich — Frontend Developer & Creative Technologist. Building digital experiences that feel alive." />
    <meta name="theme-color" content="#050508" />

    <!-- Fonts: Space Grotesk + Inter + JetBrains Mono are self-hosted
         (files in public/fonts, @font-face rules in src/index.css) —
         no request to fonts.googleapis.com/fonts.gstatic.com anymore,
         so the preconnects for those are gone too. Preload the two
         above-the-fold families so they're discovered immediately. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-wght-normal.woff2" crossorigin />

    <!-- OG / Social -->
    <meta property="og:title" content="Mirkarim Bahodirovich | Frontend Developer" />
    <meta property="og:description" content="Building digital experiences that feel alive. Frontend Developer · UI/UX · Creative Technologist." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mirkarim-dev.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mirkarim | Frontend Developer" />
    <meta name="twitter:description" content="Building digital experiences that feel alive." />

    <!-- Critical styles for first paint -->
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0;
        background: #050508;
        color: #fff;
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; }
      /* Prevent FOUC */
      html:not(.dark) { background: #050508; }
      .skip-to-content {
        position: absolute; top: -4rem; left: 0;
        background: #00d4ff; color: #000; padding: 0.75rem 1rem;
        z-index: 9999; transition: top 0.2s; text-decoration: none;
        font-size: 0.9rem; font-weight: 700;
      }
      .skip-to-content:focus { top: 0; }
    </style>

    <!-- LCP image preload -->
    <link rel="preload" as="image" href="/Cmcoder.webp" type="image/webp" fetchpriority="high" />

    <title>Mirkarim Bahodirovich | Frontend Developer</title>
  </head>
  <body>
    <a class="skip-to-content" href="#hero">Skip to content</a>
    <!-- Force dark mode always — no FOUC -->
    <script>document.documentElement.classList.add('dark');</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
